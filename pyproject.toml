[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgsg-3"
version = "0.1.0"
description = "Gate regularization path for Prior-Guided Spectral Gating"
requires-python = ">=3.10"
dependencies = [
    "numpy", "scipy", "pandas", "scikit-learn",
    "torch", "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
