[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgsg-3"
version = "0.1.0"
description = "Gate regularization path for Prior-Guided Spectral Gating"
requires-python = ">=3.10"
dependencies = [
    "numpy", "scipy", "pandas", "scikit-learn",
    "torch", "matplotlib",
]

[project.optional-dependencies]
# scripts/12_verifica_figuras.py rasterises the committed PDFs to compare
# them with regenerated ones; a byte comparison cannot do it, because
# matplotlib stamps a creation date into every PDF. Without a rasteriser the
# script reports each figure as NOT VERIFIABLE, which is honest but useless,
# and nothing else in the repository declares the requirement. A poppler
# install (pdftoppm) satisfies it too and cannot be declared here.
verify = ["pypdfium2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Categories for the traceability matrix (scripts/16_matriz_rastreabilidade.py),
# at the author's recommendation of 2026-10-28. Registered here so that an
# unknown-mark warning means a typo rather than a new category invented in
# passing.
markers = [
    "numerico: metrics, counts and measured results",
    "estrutural: sections, extraction, consolidation, file integrity",
    "semantico: a scientific or editorial commitment whose loss would change what the paper claims",
]
